<text x="584" y="119.05" font-size="13" fill="currentColor" text-anchor="middle">in SRAM4</text>
<text x="0" y="102.5" font-size="14" fill="currentColor" font-weight="600">Target</text>
<text x="0" y="119.5" font-size="14" fill="currentColor" font-weight="600">supply</text>
