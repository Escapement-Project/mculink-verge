<svg xmlns="http://www.w3.org/2000/svg" class="vf" viewBox="0 0 720 311.5" width="720" height="311.5">
<style>
.vf{color:var(--ink,#11171d);font-family:var(--font-text,"Hanken Grotesk","Helvetica Neue",Arial,sans-serif)}
.vf .vf-2{fill:var(--ink-2,#525f6a)}
.vf .vf-rule{stroke:var(--rule,#738691)}
.vf .vf-hair{stroke:var(--hair,#bccbd3)}
.vf .vf-wire{stroke:var(--series-verge,#0f8a6c)}
.vf .vf-wiref{fill:var(--series-verge,#0f8a6c)}
.vf .vf-rulef{fill:var(--rule,#738691)}
.vf .vf-surf{fill:var(--surface,#eef4f6)}
.vf .vf-code{font-family:var(--font-code,"Martian Mono",ui-monospace,monospace)}
.vf .vf-head{font-family:var(--font-display,"Saira","Hanken Grotesk","Helvetica Neue",Arial,sans-serif);font-stretch:var(--display-stretch,normal)}
@media (prefers-color-scheme:dark){
.vf{color:var(--ink,#e6ebee)}
.vf .vf-2{fill:var(--ink-2,#aab5be)}
.vf .vf-rule{stroke:var(--rule,#636e79)}
.vf .vf-hair{stroke:var(--hair,#29333c)}
.vf .vf-wire{stroke:var(--series-verge,#1aa384)}
.vf .vf-wiref{fill:var(--series-verge,#1aa384)}
.vf .vf-rulef{fill:var(--rule,#636e79)}
.vf .vf-surf{fill:var(--surface,#151b21)}
}
</style>
<path d="M76,52H172A4,4 0 0 1 176,56V157A4,4 0 0 1 172,161H76A4,4 0 0 1 72,157V56A4,4 0 0 1 76,52Z" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair vf-surf"/>
<text x="124" y="87.05" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">ADC0</text>
<text x="124" y="103.05" font-size="13" fill="currentColor" text-anchor="middle">the target&#x27;s</text>
<text x="124" y="119.05" font-size="13" fill="currentColor" text-anchor="middle">voltage and</text>
<text x="124" y="135.05" font-size="13" fill="currentColor" text-anchor="middle">current: a pair</text>
<path d="M208,52H296A4,4 0 0 1 300,56V157A4,4 0 0 1 296,161H208A4,4 0 0 1 204,157V56A4,4 0 0 1 208,52Z" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair vf-surf"/>
<text x="252" y="79.05" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">Ring</text>
<text x="252" y="95.05" font-size="13" fill="currentColor" text-anchor="middle">in SRAM0, in</text>
<text x="252" y="111.05" font-size="13" fill="currentColor" text-anchor="middle">segments of</text>
<text x="252" y="127.05" font-size="13" fill="currentColor" text-anchor="middle">about 1 ms</text>
<text x="252" y="143.05" font-size="13" fill="currentColor" text-anchor="middle">or longer</text>
<path d="M330,52H512A4,4 0 0 1 516,56V157A4,4 0 0 1 512,161H330A4,4 0 0 1 326,157V56A4,4 0 0 1 330,52Z" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair vf-surf"/>
<text x="421" y="71.05" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">CPU 0</text>
<text x="421" y="87.05" font-size="13" fill="currentColor" text-anchor="middle">adds each segment to the</text>
<text x="421" y="103.05" font-size="13" fill="currentColor" text-anchor="middle">energy total; writes the</text>
<text x="421" y="119.05" font-size="13" fill="currentColor" text-anchor="middle">stream&#x27;s messages</text>
<text x="421" y="135.05" font-size="13" fill="currentColor" text-anchor="middle" class="vf-2">its loop switches the range</text>
<text x="421" y="151.05" font-size="13" fill="currentColor" text-anchor="middle" class="vf-2">back to low</text>
<path d="M546,52H622A4,4 0 0 1 626,56V157A4,4 0 0 1 622,161H546A4,4 0 0 1 542,157V56A4,4 0 0 1 546,52Z" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair vf-surf"/>
