<svg xmlns="http://www.w3.org/2000/svg" class="vf" viewBox="0 0 720 660" width="720" height="660">
<style>
.vf{color:var(--ink,#11171d);font-family:var(--font-text,"Hanken Grotesk","Helvetica Neue",Arial,sans-serif)}
.vf .vf-2{fill:var(--ink-2,#525f6a)}
.vf .vf-rule{stroke:var(--rule,#738691)}
.vf .vf-hair{stroke:var(--hair,#bccbd3)}
.vf .vf-wire{stroke:var(--series-verge,#0f8a6c)}
.vf .vf-wiref{fill:var(--series-verge,#0f8a6c)}
.vf .vf-rulef{fill:var(--rule,#738691)}
.vf .vf-surf{fill:var(--surface,#eef4f6)}
.vf .vf-code{font-family:var(--font-code,"Martian Mono",ui-monospace,monospace)}
.vf .vf-head{font-family:var(--font-display,"Saira","Hanken Grotesk","Helvetica Neue",Arial,sans-serif);font-stretch:var(--display-stretch,normal)}
@media (prefers-color-scheme:dark){
.vf{color:var(--ink,#e6ebee)}
.vf .vf-2{fill:var(--ink-2,#aab5be)}
.vf .vf-rule{stroke:var(--rule,#636e79)}
.vf .vf-hair{stroke:var(--hair,#29333c)}
.vf .vf-wire{stroke:var(--series-verge,#1aa384)}
.vf .vf-wiref{fill:var(--series-verge,#1aa384)}
.vf .vf-rulef{fill:var(--rule,#636e79)}
.vf .vf-surf{fill:var(--surface,#151b21)}
}
</style>
<text x="118" y="18" font-size="14" fill="currentColor" class="vf-2">The command</text>
<text x="682" y="18" font-size="14" fill="currentColor" text-anchor="end" class="vf-2">The reply</text>
<path d="M0,30H720" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair"/>
<text x="0" y="52" font-size="17" fill="currentColor" font-weight="500" class="vf-head">Host</text>
<circle cx="96" cy="47" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="96" y="51.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">1</text>
<text x="118" y="52" font-size="14" fill="currentColor">The host sends a <tspan class="vf-code" font-size="12.6">DAP_Transfer</tspan></text>
<text x="128" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">05</text>
<text x="152" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">00</text>
<text x="176" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">01</text>
<text x="200" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">06</text>
<text x="220" y="70" font-size="14" fill="currentColor" class="vf-2">on EP1 OUT</text>
<circle cx="704" cy="47" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="704" y="51.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">12</text>
<text x="682" y="52" font-size="14" fill="currentColor" text-anchor="end">The host reads it on EP1 IN</text>
<text x="528" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">05</text>
<text x="552" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">01</text>
<text x="576" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">01</text>
<text x="600" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">d0</text>
<text x="624" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">d1</text>
<text x="648" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">d2</text>
<text x="672" y="70" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">d3</text>
<path d="M0,84H720" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair"/>
<text x="0" y="106" font-size="17" fill="currentColor" font-weight="500" class="vf-head">USB</text>
<circle cx="96" cy="101" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="96" y="105.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">2</text>
<text x="118" y="106" font-size="14" fill="currentColor">The controller fills a request slot</text>
<text x="118" y="124" font-size="14" fill="currentColor" class="vf-2">in <tspan class="vf-code" font-size="12.6">dap_shared</tspan>, in USB SRAM</text>
<circle cx="704" cy="101" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="704" y="105.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">11</text>
<text x="682" y="106" font-size="14" fill="currentColor" text-anchor="end">The controller sends it when asked</text>
<text x="682" y="124" font-size="14" fill="currentColor" text-anchor="end" class="vf-2"><tspan class="vf-code" font-size="12.6">tud_vendor_tx_cb</tspan> frees the slot</text>
<path d="M0,138H720" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair"/>
<text x="0" y="160" font-size="17" fill="currentColor" font-weight="500" class="vf-head">CPU 0</text>
<circle cx="96" cy="155" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="96" y="159.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">3</text>
<text x="118" y="160" font-size="14" fill="currentColor"><tspan class="vf-code" font-size="12.6">tud_vendor_rx_cb</tspan> in <tspan class="vf-code" font-size="12.6">main.c</tspan></text>
<text x="128" y="178" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">05</text>
<path d="M118,183H138" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="152" y="178" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">00</text>
<text x="176" y="178" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">01</text>
<text x="200" y="178" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">06</text>
<text x="220" y="178" font-size="14" fill="currentColor" class="vf-2">not an abort</text>
<text x="118" y="200" font-size="14" fill="currentColor">Copies it into <tspan class="vf-code" font-size="12.6">dap_stage</tspan> in SRAM3,</text>
<text x="118" y="218" font-size="14" fill="currentColor">numbers it, raises CPU 1&#x27;s mailbox</text>
<circle cx="704" cy="155" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="704" y="159.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">10</text>
<text x="682" y="160" font-size="14" fill="currentColor" text-anchor="end"><tspan class="vf-code" font-size="12.6">send_bulk_head</tspan> in <tspan class="vf-code" font-size="12.6">main.c</tspan></text>
<text x="682" y="178" font-size="14" fill="currentColor" text-anchor="end">Copies it into the slot&#x27;s USB buffer,</text>
<text x="682" y="196" font-size="14" fill="currentColor" text-anchor="end">starts EP1 IN</text>
<path d="M0,228H720" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair"/>
<text x="0" y="246" font-size="13" fill="currentColor" class="vf-2">mailbox</text>
<path d="M0,254H720" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair"/>
<text x="0" y="276" font-size="17" fill="currentColor" font-weight="500" class="vf-head">CPU 1</text>
<circle cx="96" cy="271" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="96" y="275.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">4</text>
<text x="118" y="276" font-size="14" fill="currentColor"><tspan class="vf-code" font-size="12.6">dap_task</tspan> in <tspan class="vf-code" font-size="12.6">core1_main.c</tspan></text>
<text x="118" y="294" font-size="14" fill="currentColor">Takes the oldest command, frees its slot,</text>
<text x="118" y="312" font-size="14" fill="currentColor">runs it from <tspan class="vf-code" font-size="12.6">dap_stage</tspan></text>
<circle cx="704" cy="271" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="704" y="275.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">9</text>
<text x="682" y="276" font-size="14" fill="currentColor" text-anchor="end"><tspan class="vf-code" font-size="12.6">dap_task</tspan> in <tspan class="vf-code" font-size="12.6">core1_main.c</tspan></text>
<text x="682" y="294" font-size="14" fill="currentColor" text-anchor="end">Publishes it in the reply ring,</text>
<text x="682" y="312" font-size="14" fill="currentColor" text-anchor="end">raises CPU 0&#x27;s mailbox</text>
<circle cx="96" cy="335" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="96" y="339.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">5</text>
<text x="118" y="340" font-size="14" fill="currentColor"><tspan class="vf-code" font-size="12.6">DAP_ProcessCommand</tspan> in <tspan class="vf-code" font-size="12.6">dap_dispatch.c</tspan></text>
<text x="128" y="358" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">05</text>
<path d="M118,363H138" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="152" y="358" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">00</text>
<text x="176" y="358" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">01</text>
<text x="200" y="358" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">06</text>
<text x="220" y="358" font-size="14" fill="currentColor" class="vf-2"><tspan class="vf-code" font-size="12.6">DAP_Transfer</tspan>, on SWD</text>
<circle cx="96" cy="381" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="96" y="385.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">6</text>
<text x="118" y="386" font-size="14" fill="currentColor"><tspan class="vf-code" font-size="12.6">SWD_TransferCommand</tspan> in <tspan class="vf-code" font-size="12.6">swd_dp.c</tspan></text>
<text x="128" y="404" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">05</text>
<text x="152" y="404" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">00</text>
<path d="M142,409H162" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="176" y="404" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">01</text>
<path d="M166,409H186" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="200" y="404" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">06</text>
<path d="M190,409H210" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="118" y="426" font-size="14" fill="currentColor">ARM&#x27;s transfer loop: a DP read of 0x4,</text>
<text x="118" y="444" font-size="14" fill="currentColor">which <tspan class="vf-code" font-size="12.6">swd_gen_packet</tspan> makes 8D</text>
<circle cx="96" cy="463" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="96" y="467.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">7</text>
<text x="118" y="468" font-size="14" fill="currentColor"><tspan class="vf-code" font-size="12.6">swd_gen_read</tspan>, generated into SRAMX</text>
<text x="118" y="486" font-size="14" fill="currentColor">Drives the pins to the cycle,</text>
<text x="118" y="504" font-size="14" fill="currentColor">then samples the target&#x27;s answer</text>
<circle cx="704" cy="463" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="704" y="467.5" font-size="13" fill="currentColor" font-weight="600" text-anchor="middle">8</text>
<text x="682" y="468" font-size="14" fill="currentColor" text-anchor="end"><tspan class="vf-code" font-size="12.6">SWD_TransferCommand</tspan> in <tspan class="vf-code" font-size="12.6">swd_dp.c</tspan></text>
<text x="528" y="486" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code vf-2">05</text>
<text x="552" y="486" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">01</text>
<path d="M542,491H562" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="576" y="486" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">01</text>
<path d="M566,491H586" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="600" y="486" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">d0</text>
<path d="M590,491H610" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="624" y="486" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">d1</text>
<path d="M614,491H634" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="648" y="486" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">d2</text>
<path d="M638,491H658" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="672" y="486" font-size="13" fill="currentColor" text-anchor="middle" class="vf-code">d3</text>
<path d="M662,491H682" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="682" y="508" font-size="14" fill="currentColor" text-anchor="end">One done, ACK OK, the word,</text>
<text x="682" y="526" font-size="14" fill="currentColor" text-anchor="end">written into <tspan class="vf-code" font-size="12.6">dap_stage</tspan></text>
