<svg xmlns="http://www.w3.org/2000/svg" class="vf" viewBox="0 0 720 950" width="720" height="950">
<style>
.vf{color:var(--ink,#11171d);font-family:var(--font-text,"Hanken Grotesk","Helvetica Neue",Arial,sans-serif)}
.vf .vf-2{fill:var(--ink-2,#525f6a)}
.vf .vf-rule{stroke:var(--rule,#738691)}
.vf .vf-hair{stroke:var(--hair,#bccbd3)}
.vf .vf-wire{stroke:var(--series-verge,#0f8a6c)}
.vf .vf-wiref{fill:var(--series-verge,#0f8a6c)}
.vf .vf-rulef{fill:var(--rule,#738691)}
.vf .vf-surf{fill:var(--surface,#eef4f6)}
.vf .vf-code{font-family:var(--font-code,"Martian Mono",ui-monospace,monospace)}
.vf .vf-head{font-family:var(--font-display,"Saira","Hanken Grotesk","Helvetica Neue",Arial,sans-serif);font-stretch:var(--display-stretch,normal)}
@media (prefers-color-scheme:dark){
.vf{color:var(--ink,#e6ebee)}
.vf .vf-2{fill:var(--ink-2,#aab5be)}
.vf .vf-rule{stroke:var(--rule,#636e79)}
.vf .vf-hair{stroke:var(--hair,#29333c)}
.vf .vf-wire{stroke:var(--series-verge,#1aa384)}
.vf .vf-wiref{fill:var(--series-verge,#1aa384)}
.vf .vf-rulef{fill:var(--rule,#636e79)}
.vf .vf-surf{fill:var(--surface,#151b21)}
}
</style>
<text x="214" y="22" font-size="17" fill="currentColor" font-weight="500" text-anchor="end" class="vf-head">CPU 0</text>
<text x="508" y="22" font-size="17" fill="currentColor" font-weight="500" class="vf-head">CPU 1</text>
<path d="M236,44H486V146H236Z" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule vf-surf"/>
<text x="246" y="65" font-size="14" fill="currentColor">Request and reply slots, queues,</text>
<text x="246" y="83" font-size="14" fill="currentColor">DMA&#x27;s channel table, the SWO ring</text>
<text x="246" y="101" font-size="13" fill="currentColor" class="vf-2">written by both cores, the USB</text>
<text x="246" y="119" font-size="13" fill="currentColor" class="vf-2">controller and DMA</text>
<text x="246" y="138" font-size="14" fill="currentColor"><tspan class="vf-code" font-size="12.6">dap_shared</tspan></text>
<text x="476" y="138" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x4010_1000</text>
<text x="246" y="198" font-size="14" fill="currentColor" font-weight="600">USB SRAM</text>
<text x="476" y="198" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x4010_0000</text>
<path d="M236,44H486V206H236Z" fill="none" stroke="currentColor" stroke-width="1.5" class="vf-rule"/>
<path d="M236,234H486V336H236Z" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule vf-surf"/>
<text x="246" y="255" font-size="14" fill="currentColor">Stream messages:</text>
<text x="246" y="273" font-size="14" fill="currentColor">16 slots of 512 bytes</text>
<text x="246" y="291" font-size="13" fill="currentColor" class="vf-2">written by the core that owns the</text>
<text x="246" y="309" font-size="13" fill="currentColor" class="vf-2">capture state</text>
<text x="246" y="328" font-size="14" fill="currentColor" font-weight="600">SRAM4</text>
<text x="476" y="328" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x2004_0000</text>
<path d="M236,336H486V420H236Z" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule vf-surf"/>
<text x="246" y="357" font-size="14" fill="currentColor">Staged commands and replies,</text>
<text x="246" y="375" font-size="14" fill="currentColor">HID replies, Verge Aux&#x27;s slot</text>
<text x="246" y="393" font-size="13" fill="currentColor" class="vf-2">written by both cores</text>
<text x="246" y="412" font-size="14" fill="currentColor"><tspan class="vf-code" font-size="12.6">dap_stage</tspan></text>
<text x="476" y="412" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x2003_E000</text>
<text x="246" y="446" font-size="14" fill="currentColor" font-weight="600">SRAM3</text>
<text x="476" y="446" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x2003_0000</text>
<path d="M236,454H486" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" class="vf-rule"/>
<path d="M236,484H486" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" class="vf-rule"/>
<text x="246" y="476" font-size="14" fill="currentColor">The abort flag, which CPU 0 sets</text>
<text x="246" y="524" font-size="14" fill="currentColor" font-weight="600">SRAM2</text>
<text x="476" y="524" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x2002_0000</text>
<path d="M236,532H486" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair"/>
<text x="476" y="572" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x2001_4000</text>
<path d="M236,580H486" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair"/>
<text x="246" y="606" font-size="14" fill="currentColor" font-weight="600">SRAM1</text>
<text x="476" y="606" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x2001_0000</text>
<path d="M236,614H486" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair"/>
<path d="M236,640H486" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" class="vf-rule"/>
<path d="M236,670H486" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" class="vf-rule"/>
<text x="246" y="662" font-size="14" fill="currentColor">Energy capture&#x27;s state</text>
<text x="246" y="736" font-size="14" fill="currentColor" font-weight="600">SRAM0</text>
<text x="476" y="736" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x2000_0000</text>
<path d="M236,222H486V744H236Z" fill="none" stroke="currentColor" stroke-width="1.5" class="vf-rule"/>
<text x="246" y="796" font-size="14" fill="currentColor" font-weight="600">SRAMX</text>
<text x="476" y="796" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x0400_0000</text>
<path d="M236,760H486V804H236Z" fill="none" stroke="currentColor" stroke-width="1.5" class="vf-rule"/>
<text x="476" y="846" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x4_0000</text>
<path d="M236,854H486" fill="none" stroke="currentColor" stroke-width="1" class="vf-hair"/>
<text x="246" y="880" font-size="14" fill="currentColor" font-weight="600">Flash</text>
<text x="476" y="880" font-size="13" fill="currentColor" text-anchor="end" class="vf-code vf-2">0x0000_0000</text>
<path d="M236,820H486V888H236Z" fill="none" stroke="currentColor" stroke-width="1.5" class="vf-rule"/>
<path d="M231,147H226V205H231" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule"/>
<text x="214" y="164" font-size="14" fill="currentColor" text-anchor="end">TinyUSB&#x27;s buffers,</text>
<text x="214" y="181" font-size="14" fill="currentColor" text-anchor="end">Verge Aux&#x27;s included</text>
<text x="214" y="198" font-size="13" fill="currentColor" text-anchor="end" class="vf-2">the USB controller writes them too</text>
<path d="M231,615H226V639H231" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule"/>
<text x="214" y="632" font-size="14" fill="currentColor" text-anchor="end">The stack, in the top 4 KiB</text>
<path d="M231,641H226V743H231" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule"/>
<text x="214" y="671.5" font-size="14" fill="currentColor" text-anchor="end">Data, the loop and the code a</text>
<text x="214" y="688.5" font-size="14" fill="currentColor" text-anchor="end">command passes through</text>
<text x="214" y="705.5" font-size="13" fill="currentColor" text-anchor="end" class="vf-2">the consoles&#x27; rings and the energy</text>
<text x="214" y="722.5" font-size="13" fill="currentColor" text-anchor="end" class="vf-2">ring, which DMA fills</text>
<path d="M231,855H226V887H231" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule"/>
<text x="214" y="876" font-size="14" fill="currentColor" text-anchor="end">Code, from <tspan class="vf-code" font-size="12.6">0x200</tspan></text>
<path d="M491,455H496V579H491" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule"/>
<path d="M496,454V421" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" class="vf-rule"/>
<text x="508" y="471" font-size="14" fill="currentColor">From <tspan class="vf-code" font-size="12.6">0x2001_4000</tspan>, the</text>
<text x="508" y="488" font-size="14" fill="currentColor">command path, the SWD</text>
<text x="508" y="505" font-size="14" fill="currentColor">generator and the JTAG</text>
<text x="508" y="522" font-size="14" fill="currentColor">generator&#x27;s scans, then data,</text>
<text x="508" y="539" font-size="14" fill="currentColor">running on into SRAM2</text>
<text x="508" y="556" font-size="13" fill="currentColor" class="vf-2">how far depends on the compiler;</text>
<text x="508" y="573" font-size="13" fill="currentColor" class="vf-2">rarely used data may reach SRAM3</text>
<path d="M491,581H496V613H491" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule"/>
<text x="508" y="602" font-size="14" fill="currentColor">16 KiB of stack</text>
<path d="M491,761H496V803H491" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule"/>
<text x="508" y="778.5" font-size="14" fill="currentColor">The generated wire code,</text>
<text x="508" y="795.5" font-size="13" fill="currentColor" class="vf-2">written at runtime</text>
<path d="M491,821H496V853H491" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule"/>
<text x="508" y="842" font-size="14" fill="currentColor">Code, from <tspan class="vf-code" font-size="12.6">0x4_0000</tspan></text>
<path d="M236,907H258V921H236Z" fill="none" stroke="currentColor" stroke-width="1" class="vf-rule vf-surf"/>
<text x="266" y="918" font-size="13" fill="currentColor" class="vf-2">placed at one address by both link scripts</text>
<path d="M236,929h22" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" class="vf-rule"/>
<path d="M236,943h22" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" class="vf-rule"/>
<text x="266" y="941" font-size="13" fill="currentColor" class="vf-2">reached through a pointer in <tspan class="vf-code" font-size="11.7">dap_shared</tspan></text>
</svg>
