# Builds the firmware for a version tag, checks it in the emulator, signs it, and attaches it to
# the tag's release in the layout the verge update tool reads (its core/src/release.rs):
#
#   mculink-verge-<tag>.s19          the image, as objcopy -O srec writes it
#   mculink-verge-<tag>.s19.sha256   sha256sum's line for it
#   mculink-verge-<tag>.s19.minisig  minisign's signature; its trusted comment names the file
#                                    and the tag
#
# LICENSE and THIRD-PARTY-NOTICES.md go with them, and newlib's COPYING.NEWLIB and COPYING.LIBGLOSS
# from the build's own package: the image carries TinyUSB's MIT code, NXP's BSD-3-Clause drivers
# and newlib-nano, whose licences ask for their notices to travel with a binary.
#
# The secret key never shares a machine with code the build fetched and ran. `build` has no
# secret, and hands the image and its checksum on as an artifact. `sign` runs only minisign, in
# the `release` environment, which holds the key and waits for a required reviewer. `publish`
# attaches the three files, without the key. No build cache, so nothing another workflow wrote can
# reach a release.
#
# The `release` environment needs a required reviewer, which `sign` checks first, and the secret
# MINISIGN_SECRET_KEY: the whole secret key file from `minisign -G -W`, which has no password. Its
# variable MINISIGN_PUBLIC_KEY, the base64 line of the matching .pub file, is optional; when set,
# the signature is checked against it before it leaves the job. README.md, "Releases", has the
# settings this relies on.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch's arm-none-eabi-gcc is the compiler the bench builds with, and `ninja check` holds the
    # image to baselines it made. The container and Arch's archive are both pinned to a day, so
    # the compiler changes only in a commit that moves both.
    container: archlinux@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4 # latest, 2026-10-19
    steps:
      - name: Install the toolchain as Arch had it on 2026-10-20
        run: |
          # pacman expands $repo and $arch.
          # shellcheck disable=SC2016
          echo 'Server =https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syuu --noconfirm --needed \
            git python cmake ninja uv \
            arm-none-eabi-gcc arm-none-eabi-newlib arm-none-eabi-binutils

      - uses: actions/checkout@v7
        with:
          submodules: false
          # This workflow runs on a version tag; that tag is enough for `git describe`.
          fetch-depth: 1

      - name: Let git work in a checkout another user owns
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch pinned submodules with shallow history
        run: git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 2

      - name: Fetch TinyUSB's NXP dependencies
        run: python external/tinyusb/tools/get_deps.py lpc55

      - name: Build
        run: |
          cmake -B build -G Ninja -DBOARD=mcu_link -DTOOLCHAIN=gcc .
          ninja -C build

      - name: Check the image in the emulator
        run: ninja -C build check

      - name: Name and checksum
        run: |
          set -eu
          name="mculink-verge-${GITHUB_REF_NAME}.s19"
          mkdir out
          arm-none-eabi-objcopy -O srec build/mculink_cjtag.elf "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256")
          cp LICENSE THIRD-PARTY-NOTICES.md out/
          cp /usr/share/licenses/arm-none-eabi-newlib/COPYING.NEWLIB \
            /usr/share/licenses/arm-none-eabi-newlib/COPYING.LIBGLOSS out/

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: out/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
    steps:
      # GitHub creates an environment named in a workflow on first use, with no protection. This
      # catches that, not a hostile tag: a tag's own workflow decides this job's steps.
      - name: Refuse an environment nobody has to approve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq \
            '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
          if [ "$reviewers" -eq 0 ]; then
            echo "the release environment has no required reviewer; nothing is signed" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: image
          path: out

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          set -eu
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "the release environment has no MINISIGN_SECRET_KEY; nothing is published unsigned" >&2
            exit 1
          fi
          name="mculink-verge-${GITHUB_REF_NAME}.s19"
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m "out/$name" -x "out/$name.minisig" \
            -t "file:$name tag:$GITHUB_REF_NAME"
          rm -f "$key"
          if [ -n "$MINISIGN_PUBLIC_KEY" ]; then
            minisign -V -P "$MINISIGN_PUBLIC_KEY" -m "out/$name" -x "out/$name.minisig"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: signature
          path: out/*.minisig
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Attach to the release
        run: |
          set -eu
          name="mculink-verge-${GITHUB_REF_NAME}.s19"
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "out/$name" "out/$name.sha256" "out/$name.minisig" \
            out/LICENSE out/THIRD-PARTY-NOTICES.md out/COPYING.NEWLIB out/COPYING.LIBGLOSS
