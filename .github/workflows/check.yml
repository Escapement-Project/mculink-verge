# The gate on every push and pull request: host checks and GCC/Clang images in both code-generation
# configurations, held to their baselines in the emulator.
# AGENTS.md has what it covers. The caches are skipped under act: its job containers have no Node,
# which GitHub's runners mount.

name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    container: archlinux@sha256:ece6c971fec3c532fd508bce299a446deaf469feecbfe7c353e995bc1a5e7bba # latest, 2026-11-02
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - name: Install the host-check toolchain
        run: |
          # pacman expands $repo and $arch.
          # shellcheck disable=SC2016
          echo 'Server =https://archive.archlinux.org/repos/2026/11/02/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syuu --noconfirm --needed \
            git python cmake ninja uv gcc clang lld llvm qemu-system-arm \
            arm-none-eabi-gcc arm-none-eabi-newlib arm-none-eabi-binutils

      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Let git work in a checkout another user owns
        run: git config --global --add safe.directory '*'

      # tools/jtag_transfer_test.py compares its extract with ARM's DAP.c and builds against
      # CMSIS-DAP's headers.
      - name: Fetch ARM's CMSIS-DAP
        run: git -c protocol.version=2 submodule update --init --depth 1 external/CMSIS-DAP

      - name: Identify uv script dependency inputs
        id: uv-key
        run: echo "hash=$(python tools/uv_cache_key.py)" >> "$GITHUB_OUTPUT"

      - name: Cache uv packages and interpreters
        uses: actions/cache@v6
        if: ${{ !env.ACT }}
        with:
          path: .cache/uv
          key: ${{ runner.os }}-uv-arch-2026-11-02-${{ steps.uv-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-uv-arch-2026-11-02-
            ${{ runner.os }}-uv-arch-2026-11-02

      - name: Host checks
        run: uv run tools/gate.py --part host

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang]
    # Keep the check and release workflows on the same compilers and dependency revisions.
    container: archlinux@sha256:ece6c971fec3c532fd508bce299a446deaf469feecbfe7c353e995bc1a5e7bba # latest, 2026-11-02
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Install the pinned toolchain
        run: |
          # pacman expands $repo and $arch.
          # shellcheck disable=SC2016
          echo 'Server =https://archive.archlinux.org/repos/2026/11/02/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          packages=(git python cmake ninja uv arm-none-eabi-gcc arm-none-eabi-newlib arm-none-eabi-binutils)
          if [ "$TOOLCHAIN" = clang ]; then
            packages+=(clang clang-tools-extra lld llvm)
          fi
          pacman -Syuu --noconfirm --needed "${packages[@]}"

      - uses: actions/checkout@v7
        with:
          submodules: false
          # Keep history for git describe, but omit file contents from older commits.
          filter: blob:none
          fetch-depth: 0

      - name: Let git work in a checkout another user owns
        run: git config --global --add safe.directory '*'

      - name: Identify uv script dependency inputs
        id: uv-key
        run: echo "hash=$(python tools/uv_cache_key.py)" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned submodules with shallow history
        run: git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 2

      - name: Cache uv packages and interpreters
        uses: actions/cache@v6
        if: ${{ !env.ACT }}
        with:
          path: .cache/uv
          key: ${{ runner.os }}-uv-arch-2026-11-02-${{ steps.uv-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-uv-arch-2026-11-02-
            ${{ runner.os }}-uv-arch-2026-11-02

      - name: Identify TinyUSB dependency inputs
        id: tinyusb
        run: echo "revision=$(git -C external/tinyusb rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache TinyUSB LPC55 dependencies
        uses: actions/cache@v6
        if: ${{ !env.ACT }}
        with:
          path: |
            external/tinyusb/hw/mcu/nxp/mcux-devices-lpc
            external/tinyusb/hw/mcu/nxp/mcuxsdk-core
            external/tinyusb/lib/CMSIS_6
            external/tinyusb/lib/sct_neopixel
          key: ${{ runner.os }}-tinyusb-lpc55-${{ steps.tinyusb.outputs.revision }}-${{ hashFiles('external/tinyusb/tools/get_deps.py') }}

      - name: Cache TinyUSB mandatory dependencies
        uses: actions/cache@v6
        if: ${{ !env.ACT }}
        with:
          path: |
            external/tinyusb/lib/fatfs
            external/tinyusb/lib/FreeRTOS-Kernel
            external/tinyusb/lib/lwip
            external/tinyusb/lib/threadx
            external/tinyusb/tools/uf2
          key: ${{ runner.os }}-tinyusb-mandatory-${{ steps.tinyusb.outputs.revision }}-${{ hashFiles('external/tinyusb/tools/get_deps.py') }}

      - name: Fetch TinyUSB's NXP dependencies
        run: python external/tinyusb/tools/get_deps.py lpc55

      - name: GCC firmware checks
        if: matrix.toolchain == 'gcc'
        run: uv run tools/gate.py --part firmware --toolchain gcc

      - name: Clang firmware checks
        if: matrix.toolchain == 'clang'
        run: uv run tools/gate.py --part firmware --toolchain clang

  gate:
    if: always()
    needs: [host, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check partition to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          HOST_RESULT: ${{ needs.host.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$HOST_RESULT" = success
